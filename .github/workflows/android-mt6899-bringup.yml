# Android MT6899/Mali-G720 bring-up build (arm64-v8a, Full).
#
# Minimal CI for the dedicated bring-up branch ONLY. Follows the repository's
# documented flow (build_files/android/BUILDING.md + ANDROID_AI_GUIDE.md):
# cross-compile the dependency prefix, then `build.py full`.
#
# MUST run on x86_64 Linux: the Android NDK ships x86_64-only host binaries,
# and the host code generators (makesdna/makesrna/...) build natively.
# Triggered only by pushes to the bring-up branch (never the default branch).

name: android-mt6899-bringup

on:
  push:
    branches: [mt6899-mali-g720-bringup-v1]
  workflow_dispatch:

env:
  BUILD_BASE: ${{ github.workspace }}/../blender_build_android
  ANDROID_HOME: ${{ github.workspace }}/../android-sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  # Pin the repository-intended NDK at workflow level so the runner's
  # pre-existing ANDROID_NDK_ROOT (.../27.3.13750724) cannot override env.sh.
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_NDK_ROOT: ${{ github.workspace }}/../android-sdk/ndk/28.2.13676358
  ANDROID_NDK_HOME: ${{ github.workspace }}/../android-sdk/ndk/28.2.13676358

jobs:
  build-full-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout bring-up branch (with submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Host Python 3.13 (drives the numpy cross-build)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: JDK 17 (APK tooling)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Host toolchain (GCC 14+, CMake 3.26+, ninja, meson, ...)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-14 g++-14 cmake ninja-build meson pkgconf patchelf git-lfs \
            automake autoconf autoconf-archive libtool python3-dev bison flex \
            unzip zip curl ca-certificates
          git lfs install --local

      - name: Android SDK (cmdline-tools, NDK 28.2.13676358 per env.sh)
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;28.2.13676358" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Resolve dependency cache identity
        id: deps-key
        run: |
          source build_files/android/env.sh
          # env.sh honours the runner's NDK override; key the actual compiler,
          # not the version merely installed by sdkmanager above.
          NDK_REVISION=$(sed -n 's/^Pkg.Revision *= *//p' "$ANDROID_NDK_ROOT/source.properties")
          test -n "$NDK_REVISION"
          echo "Effective NDK: $ANDROID_NDK_ROOT ($NDK_REVISION)"
          # OpenPGL is always rebuilt below, so repairs to that final recipe
          # can reuse the preceding 69 dependencies. All other recipes count.
          DEPS_HASH=$({
            sed '/^build_openpgl() {/,/^}/d' build_files/android/deps/build.sh
            cat build_files/android/env.sh build_files/build_environment/cmake/versions.cmake
          } | sha256sum | cut -d ' ' -f 1)
          echo "prefix=android-deps-v2-${{ runner.os }}-${{ runner.arch }}-${ANDROID_ABI}-api${ANDROID_API}-ndk${NDK_REVISION}-${DEPS_HASH}-" >> "$GITHUB_OUTPUT"

      - name: Restore dependency prefix cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          # ISPC is a host dependency outside the target prefix.
          path: |
            ${{ env.BUILD_BASE }}/lib/android_arm64
            ${{ env.BUILD_BASE }}/android_deps_build/host
          key: ${{ steps.deps-key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.deps-key.outputs.prefix }}

      - name: Fail fast if dependency checkpoint missing (recovery guard)
        run: |
          if [ -z "${{ steps.deps-cache.outputs.cache-matched-key }}" ]; then
            echo "::error::No compatible Android dependency checkpoint restored (prefix '${{ steps.deps-key.outputs.prefix }}'). Refusing fresh 70-dependency rebuild in this recovery run."
            exit 1
          fi
          echo "Restored dependency checkpoint: ${{ steps.deps-cache.outputs.cache-matched-key }}"

      - name: Cross-compile dependency prefix (one-time cost, hours)
        id: deps
        run: |
          set -o pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          mkdir -p "$BUILD_BASE"
          # Never mistake a cached or partially installed OpenPGL for the
          # current recipe. Preserve every other dependency's install dir.
          rm -rf "$BUILD_BASE/lib/android_arm64/openpgl"
          # build.sh is stored non-executable upstream (mode 100644); the repo
          # itself invokes its shell scripts via `bash` (see build.py), so do
          # the same instead of executing the file directly.
          bash build_files/android/deps/build.sh all 2>&1 | tee "$BUILD_BASE/deps.log"

      - name: Prepare dependency checkpoint
        id: checkpoint
        if: ${{ always() && steps.deps.outcome != 'skipped' }}
        run: |
          if [ '${{ steps.deps.outcome }}' = success ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif grep -Eq '^=== \[[0-9]+/[0-9]+\] building: openpgl ===$' "$BUILD_BASE/deps.log"; then
            # Reaching the final dependency proves that the preceding prefix
            # completed. Discard only the failed OpenPGL installation.
            rm -rf "$BUILD_BASE/lib/android_arm64/openpgl"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Save dependency checkpoint (including OpenPGL failure)
        if: ${{ always() && steps.checkpoint.outputs.ready == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.BUILD_BASE }}/lib/android_arm64
            ${{ env.BUILD_BASE }}/android_deps_build/host
          # Caches are immutable: each attempt must be able to save progress.
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Dump TBB/OpenPGL prefix layout (diagnostic, always runs)
        if: always()
        run: |
          echo "--- TBB prefix ---"
          ls -R "${BUILD_BASE}/lib/android_arm64/tbb/lib" 2>&1 | head -n 40
          echo "--- TBB cmake config dir (OpenPGL TBB_DIR target) ---"
          ls -la "${BUILD_BASE}/lib/android_arm64/tbb/lib/cmake/TBB" 2>&1
          echo "--- openpgl prefix present? ---"
          ls "${BUILD_BASE}/lib/android_arm64/openpgl" 2>&1 || true

      - name: Populate native Linux host precompiled libraries (host codegen)
        run: |
          python3 build_files/utils/make_update.py --no-blender --architecture x86_64
          test -d lib/linux_x64 || { echo "::error::lib/linux_x64 missing after make_update"; exit 1; }
          test -n "$(ls -A lib/linux_x64)" || { echo "::error::lib/linux_x64 is empty after make_update"; exit 1; }
          find lib/linux_x64 -maxdepth 4 -name jpeglib.h | grep -q . || { echo "::error::host JPEG include (jpeglib.h) not found under lib/linux_x64"; exit 1; }
          echo "Host precompiled bundle OK:"; ls lib/linux_x64 | head -n 30

      - name: Build Full APK (arm64-v8a)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          python3 build_files/android/build.py full --build-base "$BUILD_BASE"

      - name: Record APK identity
        run: |
          ls -lh "$BUILD_BASE/apk"
          APK=$(ls -t "$BUILD_BASE"/apk/*.apk | head -n 1)
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK" | tee "$BUILD_BASE/apk/SHA256SUMS.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-full-mt6899
          path: |
            ${{ env.BUILD_BASE }}/apk/*.apk
            ${{ env.BUILD_BASE }}/apk/SHA256SUMS.txt
          if-no-files-found: error
